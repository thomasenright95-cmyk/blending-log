<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Leftfield — Blending Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --ink:     #1C2B3A;
    --ink2:    #2E4A62;
    --ink3:    #4A7FA5;
    --cream:   #F6F3EE;
    --cream2:  #EDE9E1;
    --sage:    #C8DDB8;
    --sage-d:  #2D5016;
    --amber:   #C87941;
    --amber-l: #F5E6D3;
    --red:     #A63228;
    --red-l:   #F5D5D3;
    --w1:      #2E4A62;
    --w2:      #2D5E3A;
    --w3:      #5C3A1E;
    --w4:      #3A2D5E;
    --r: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: var(--ink);
    padding: 20px 20px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.15em; text-transform: uppercase; }
  .header h1 { font-size: 20px; font-weight: 600; color: #fff; margin-top: 4px; }
  .sync-pill { font-size: 11px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 4px 10px; border-radius: 20px; font-family: 'DM Mono', monospace; }

  /* ── WEEK TABS ── */
  .week-strip { display: flex; gap: 6px; padding: 14px 20px; background: var(--ink); border-top: 1px solid rgba(255,255,255,0.08); overflow-x: auto; }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: transparent; color: rgba(255,255,255,0.5);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .week-btn.active { border-color: transparent; color: var(--ink); font-weight: 600; }
  .week-btn[data-wk="0"].active { background: var(--w1); color: #fff; }
  .week-btn[data-wk="1"].active { background: var(--w2); color: #fff; }
  .week-btn[data-wk="2"].active { background: var(--w3); color: #fff; }
  .week-btn[data-wk="3"].active { background: var(--w4); color: #fff; }
  .week-dates { font-size: 10px; opacity: 0.7; display: block; margin-top: 1px; }

  /* ── DAY TABS ── */
  .day-strip { display: flex; padding: 12px 20px 0; gap: 8px; background: var(--cream); border-bottom: 2px solid var(--cream2); }
  .day-btn {
    padding: 8px 18px; font-size: 14px; font-weight: 500;
    border: none; background: transparent; color: rgba(28,43,58,0.45);
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .day-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* ── SUMMARY BAR ── */
  .summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 14px 20px; background: var(--cream2); }
  .summary-card { background: #fff; border-radius: var(--r); padding: 12px 14px; border: 1px solid rgba(0,0,0,0.06); }
  .summary-card .s-label { font-size: 10px; color: rgba(28,43,58,0.5); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary-card .s-val { font-size: 26px; font-weight: 600; color: var(--ink); margin-top: 2px; line-height: 1; }
  .summary-card .s-sub { font-size: 11px; color: rgba(28,43,58,0.45); margin-top: 3px; }

  /* ── BLEND CARDS ── */
  .blend-list { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }

  .blend-card {
    background: #fff; border-radius: var(--r);
    border: 1.5px solid rgba(0,0,0,0.07);
    padding: 16px; transition: border-color 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .blend-card.complete { border-color: var(--sage-d); background: #f6fbf2; }

  .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .blend-name { font-size: 18px; font-weight: 600; color: var(--ink); flex: 1; }
  .badge {
    font-size: 10px; font-family: 'DM Mono', monospace;
    padding: 3px 8px; border-radius: 20px; flex-shrink: 0; margin-top: 3px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-focus { background: var(--ink); color: #fff; }
  .badge-fill  { background: var(--cream2); color: rgba(28,43,58,0.6); }
  .badge-done  { background: var(--sage); color: var(--sage-d); }

  /* Progress bar */
  .prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .prog-track { flex: 1; height: 6px; background: var(--cream2); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }
  .prog-label { font-size: 12px; color: rgba(28,43,58,0.5); min-width: 72px; text-align: right; font-family: 'DM Mono', monospace; }

  /* Counter */
  .counter-row { display: flex; align-items: center; gap: 0; }
  .day-label { font-size: 12px; color: rgba(28,43,58,0.5); min-width: 80px; }
  .counter { display: flex; align-items: center; gap: 12px; }
  .count-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--ink); color: #fff;
    font-size: 24px; font-weight: 300; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; user-select: none; -webkit-user-select: none;
    font-family: 'DM Sans', sans-serif;
  }
  .count-btn:active { transform: scale(0.93); background: var(--ink2); }
  .count-btn.disabled { background: #ddd; border-color: #ddd; cursor: not-allowed; color: #aaa; }
  .count-num { font-size: 28px; font-weight: 600; color: var(--ink); min-width: 36px; text-align: center; font-family: 'DM Mono', monospace; }
  .count-kg { font-size: 12px; color: rgba(28,43,58,0.45); margin-left: 6px; font-family: 'DM Mono', monospace; }
  .weekend-chip {
    margin-left: auto; font-size: 12px; font-family: 'DM Mono', monospace;
    padding: 5px 12px; border-radius: 20px; background: var(--cream2); color: rgba(28,43,58,0.55);
  }
  .weekend-chip.done { background: var(--sage); color: var(--sage-d); font-weight: 500; }

  /* ── FOOTER ACTIONS ── */
  .footer { padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 10px; }
  .btn-send {
    width: 100%; padding: 16px; border-radius: var(--r);
    background: var(--ink); color: #fff;
    font-size: 16px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    border: none; cursor: pointer; transition: background 0.15s;
    letter-spacing: 0.01em;
  }
  .btn-send:active { background: var(--ink2); }
  .btn-reset {
    width: 100%; padding: 12px; border-radius: var(--r);
    background: transparent; color: rgba(28,43,58,0.45);
    font-size: 14px; font-family: 'DM Sans', sans-serif;
    border: 1.5px solid rgba(28,43,58,0.15); cursor: pointer;
  }
  .btn-reset:active { background: var(--cream2); }

  /* ── WEEK COLOUR ACCENTS ── */
  .wk-0 .prog-fill, .wk-0 .count-btn { background: var(--w1); border-color: var(--w1); }
  .wk-1 .prog-fill, .wk-1 .count-btn { background: var(--w2); border-color: var(--w2); }
  .wk-2 .prog-fill, .wk-2 .count-btn { background: var(--w3); border-color: var(--w3); }
  .wk-3 .prog-fill, .wk-3 .count-btn { background: var(--w4); border-color: var(--w4); }
  .wk-0 .count-btn.disabled, .wk-1 .count-btn.disabled,
  .wk-2 .count-btn.disabled, .wk-3 .count-btn.disabled
    { background: #ddd !important; border-color: #ddd !important; color: #aaa !important; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; padding: 12px 22px;
    border-radius: 24px; font-size: 14px; font-weight: 500;
    transition: transform 0.3s ease; z-index: 999; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="brand">Leftfield Coffee</span>
    <span class="sync-pill" id="saveIndicator">saved</span>
  </div>
  <h1>Blending Log</h1>
</div>

<div class="week-strip" id="weekStrip"></div>
<div class="day-strip" id="dayStrip"></div>
<div class="summary" id="summary"></div>
<div class="blend-list" id="blendList"></div>
<div class="footer">
  <button class="btn-send" onclick="sendSummary()">📧 Send Summary to Leftfield</button>
  <button class="btn-reset" onclick="resetWeek()">Clear this weekend's log</button>
</div>

<div class="toast" id="toast"></div>

<script>
const WEEKS = [
  { label:'Week 1', dates:'4–10 May', blends:[
    {name:'Old Fox',    target:23, type:'focus'},
    {name:'No Mafia',  target:13, type:'focus'},
    {name:'3 Degrees', target:17, type:'fill'},
    {name:'Duchess',   target:12, type:'fill'},
  ]},
  { label:'Week 2', dates:'11–17 May', blends:[
    {name:'Fat Puppy',     target:40, type:'focus'},
    {name:'Quokka Mokka',  target:6,  type:'focus'},
    {name:'Decafe',        target:3,  type:'fill'},
    {name:"Kam's",        target:8,  type:'fill'},
    {name:'General Public',target:6,  type:'fill'},
  ]},
  { label:'Week 3', dates:'18–24 May', blends:[
    {name:'Old Fox',       target:23, type:'focus'},
    {name:'No Mafia',      target:13, type:'focus'},
    {name:'Brazillionaire',target:22, type:'fill'},
  ]},
  { label:'Week 4', dates:'25–31 May', blends:[
    {name:'Fat Puppy',     target:40, type:'focus'},
    {name:'Quokka Mokka',  target:6,  type:'focus'},
    {name:'Decafe',        target:3,  type:'fill'},
    {name:"Kam's",        target:8,  type:'fill'},
    {name:'General Public',target:6,  type:'fill'},
  ]},
];
const DAYS = ['Friday','Saturday','Sunday'];
const BATCH_KG = 60;
const EMAIL = 'coffee@leftfieldcoffee.com';

let wk=0, day=0;

function key(w,d,b){ return `lf_${w}_${d}_${b.replace(/[^a-z0-9]/gi,'_')}`; }
function get(w,d,b){ return parseInt(localStorage.getItem(key(w,d,b))||'0',10); }
function set(w,d,b,v){ v<=0?localStorage.removeItem(key(w,d,b)):localStorage.setItem(key(w,d,b),String(v)); }
function wkTotal(w,b){ return DAYS.reduce((s,d)=>s+get(w,d,b),0); }
function pct(d,t){ return Math.min(100,Math.round(d/Math.max(1,t)*100)); }

function wkColor(w){
  return ['#2E4A62','#2D5E3A','#5C3A1E','#3A2D5E'][w];
}

// ── RENDER ───────────────────────────────────────────────────────────
function renderWeekStrip(){
  document.getElementById('weekStrip').innerHTML = WEEKS.map((w,i)=>`
    <button class="week-btn${i===wk?' active':''}" data-wk="${i}" onclick="setWk(${i})">
      ${w.label}
      <span class="week-dates">${w.dates}</span>
    </button>`).join('');
}

function renderDayStrip(){
  document.getElementById('dayStrip').innerHTML = DAYS.map((d,i)=>`
    <button class="day-btn${i===day?' active':''}" onclick="setDay(${i})">${d}</button>`).join('');
}

function renderSummary(){
  const week = WEEKS[wk];
  const tgt  = week.blends.reduce((s,b)=>s+b.target,0);
  const done = week.blends.reduce((s,b)=>s+wkTotal(wk,b.name),0);
  const tod  = week.blends.reduce((s,b)=>s+get(wk,DAYS[day],b.name),0);
  const p    = pct(done,tgt);
  const col  = p>=100?'#2D5016':p>=60?'#C87941':wkColor(wk);
  document.getElementById('summary').innerHTML = `
    <div class="summary-card">
      <div class="s-label">Target</div>
      <div class="s-val">${tgt}</div>
      <div class="s-sub">${tgt*BATCH_KG} kg</div>
    </div>
    <div class="summary-card">
      <div class="s-label">Weekend total</div>
      <div class="s-val" style="color:${col}">${done}</div>
      <div class="s-sub">${p}% · ${done*BATCH_KG} kg</div>
    </div>
    <div class="summary-card">
      <div class="s-label">${DAYS[day]}</div>
      <div class="s-val">${tod}</div>
      <div class="s-sub">${tod*BATCH_KG} kg</div>
    </div>`;
}

function renderBlends(){
  const dayName = DAYS[day];
  document.getElementById('blendList').innerHTML = WEEKS[wk].blends.map(b=>{
    const tod   = get(wk,dayName,b.name);
    const total = wkTotal(wk,b.name);
    const p     = pct(total,b.target);
    const done  = total>=b.target;
    const rem   = b.target-total;
    const col   = p>=100?'#C8DDB8':p>=60?'#F5E6D3':wkColor(wk)+'33';
    const fillC = p>=100?'#2D5016':p>=60?'#C87941':wkColor(wk);
    const bname = b.name.replace(/'/g,"\'");

    return `
      <div class="blend-card wk-${wk}${done?' complete':''}">
        <div class="card-top">
          <div class="blend-name">${b.name}</div>
          <div class="badge ${done?'badge-done':b.type==='focus'?'badge-focus':'badge-fill'}">
            ${done?'done':b.type}
          </div>
        </div>
        <div class="prog-row">
          <div class="prog-track">
            <div class="prog-fill" style="width:${p}%;background:${fillC}"></div>
          </div>
          <div class="prog-label">${done?'✓ done':rem+' left'}</div>
        </div>
        <div class="counter-row">
          <div class="day-label">${dayName}</div>
          <div class="counter">
            <button class="count-btn" onclick="adj(${wk},'${dayName}','${bname}',${tod},-1)" ${tod<=0?'disabled':''}>−</button>
            <div class="count-num">${tod}</div>
            <button class="count-btn${done?' disabled':''}" onclick="adj(${wk},'${dayName}','${bname}',${tod},+1)" ${done?'disabled':''}>+</button>
          </div>
          <div class="count-kg">${tod*BATCH_KG}kg</div>
          <div class="weekend-chip${done?' done':''}">
            ${done?'target met':total+'/'+b.target+' wknd'}
          </div>
        </div>
      </div>`;
  }).join('');
}

function render(){ renderWeekStrip(); renderDayStrip(); renderSummary(); renderBlends(); }

// ── ACTIONS ──────────────────────────────────────────────────────────
function adj(w,d,b,cur,delta){
  const total = wkTotal(w,b);
  const target = WEEKS[w].blends.find(x=>x.name===b).target;
  if(delta>0 && total>=target) return;
  const nv = Math.max(0,cur+delta);
  set(w,d,b,nv);
  flash();
  render();
}

function setWk(i){ wk=i; day=0; render(); }
function setDay(i){ day=i; render(); }

let saveTimer;
function flash(){
  const el=document.getElementById('saveIndicator');
  el.textContent='saving…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ el.textContent='saved'; },600);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function resetWeek(){
  if(!confirm('Clear all entries for '+WEEKS[wk].label+'?')) return;
  WEEKS[wk].blends.forEach(b=>DAYS.forEach(d=>localStorage.removeItem(key(wk,d,b.name))));
  render();
  showToast('Weekend log cleared');
}

function sendSummary(){
  const week = WEEKS[wk];
  const lines = [];
  lines.push('LEFTFIELD COFFEE — BLENDING LOG');
  lines.push(week.label+' ('+week.dates+')');
  lines.push('Generated: '+new Date().toLocaleString('en-AU'));
  lines.push('');

  let grandTotal=0, grandKg=0;
  DAYS.forEach(d=>{
    lines.push('── '+d+' ──');
    week.blends.forEach(b=>{
      const n=get(wk,d,b.name);
      if(n>0) lines.push('  '+b.name+': '+n+' batches ('+n*BATCH_KG+'kg)');
    });
  });

  lines.push('');
  lines.push('── WEEKEND TOTALS ──');
  week.blends.forEach(b=>{
    const tot=wkTotal(wk,b.name);
    const status=tot>=b.target?'✓ TARGET MET':'⚠ '+tot+'/'+b.target;
    lines.push('  '+b.name+': '+tot+' batches ('+tot*BATCH_KG+'kg) — '+status);
    grandTotal+=tot; grandKg+=tot*BATCH_KG;
  });
  lines.push('');
  lines.push('GRAND TOTAL: '+grandTotal+' batches / '+grandKg+'kg');
  lines.push('');
  lines.push('Sent from Leftfield Blending Log');

  const subject = encodeURIComponent('Blending Log — '+week.label+' ('+week.dates+')');
  const body    = encodeURIComponent(lines.join('\n'));
  window.location.href = 'mailto:'+EMAIL+'?subject='+subject+'&body='+body;
  showToast('Opening Mail app…');
}

render();
</script>
</body>
</html>
